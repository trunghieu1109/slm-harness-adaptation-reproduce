task_id: "refactorbench"
data_path: "data/refactorbench.json"
model_name: "qwen-vllm"
prompt_name: "default"

# GEPA settings
reflection_lm: "gpt-proposer"
max_metric_calls: 90
max_cost: 20.0
no_improvement_patience: 10
seed: 42
num_exploration: 1

# Data: source indices 30-39 train, 40-49 validation (no shuffle).
max_examples: 20
data_start_index: 30
train_ratio: 0.5

# Held-out test range. These samples are not visible during GEPA optimization.
test_data_path: "data/refactorbench.json"
test_start_index: 0
test_max_examples: 30
test_n_responses: 2

# Evaluation
eval_lm: null
agent_batch_size: 3
eval_batch_size: 16

# Reflection
use_adaptation_guide: true
# use_adaptation_guide: false

# teacher_trajectory_dir: results/refactorbench/gemini-3.1-pro-preview_default/rollouts/v0

# Docker
is_agentic: true
use_docker: true
server_image: "refactorbench:latest"
max_time: 600
