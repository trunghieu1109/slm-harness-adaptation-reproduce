task_id: "woocommerce_stock_alert_s2l"
data_path: "data/woocommerce_stock_alert_s2l.json"
model_name: "qwen3.5-9b"
prompt_name: "default"

# GEPA settings
reflection_lm: "qwen3.6-35b-a3b-fp8"
max_cost: 16.0
max_metric_calls: 225
no_improvement_patience: 10
seed: 42
num_exploration: 1

# Evaluation
eval_lm: null
agent_batch_size: 8
eval_batch_size: 16

# Data
max_examples: 10
data_start_index: 10
train_ratio: 0.5

# Held-out test range. These samples are not visible during GEPA optimization.
test_data_path: "data/woocommerce_stock_alert_s2l.json"
test_start_index: 0
test_max_examples: 10
test_n_responses: 3

# Reflection
use_adaptation_guide: true

# Docker
use_docker: true
server_image: "woocommerce_stock_alert_s2l:latest"
max_time: 600
